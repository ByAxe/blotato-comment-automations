name: Verify
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  portable-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and verify against PostgreSQL 17
        run: docker compose up --build --abort-on-container-exit --exit-code-from verify
      - name: Start the documented HTTP sandbox
        run: |
          docker compose -p comment-demo --profile sandbox up --build -d api worker
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:3030/healthz
          docker compose -p comment-demo --profile sandbox exec -T api node scripts/try-pricing.mjs
      - name: Remove disposable containers
        if: always()
        run: |
          docker compose down --volumes
          docker compose -p comment-demo --profile sandbox down --volumes
