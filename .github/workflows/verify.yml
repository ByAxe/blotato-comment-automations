name: Verify
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  portable-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify against PostgreSQL 17
        run: make verify
      - name: Start the documented HTTP sandbox
        run: make sandbox-up sandbox-demo
      - name: Remove the HTTP sandbox
        if: always()
        run: make sandbox-down
