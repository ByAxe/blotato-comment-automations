name: Verify
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  portable-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and verify against PostgreSQL 17
        run: make verify
      - name: Start the documented HTTP sandbox
        run: make sandbox-up sandbox-demo
      - name: Remove the HTTP sandbox
        if: always()
        run: make sandbox-down
