services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_PASSWORD: disposable-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  verify:
    build:
      context: .
      target: verify
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_TEST_ADMIN_URL: postgres://postgres:disposable-test-only@postgres/postgres
  migrate:
    profiles: [sandbox]
    build: &runtime
      context: .
      target: runtime
    environment:
      DATABASE_URL: &app-db postgres://postgres:disposable-test-only@postgres/postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "scripts/migrate.mjs"]
  provider:
    profiles: [sandbox]
    build: *runtime
    command: ["node", "dist/scripts/recording-provider.js"]
    environment:
      PROVIDER_HOST: 0.0.0.0
      PROVIDER_TOKEN: local-provider
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    profiles: [sandbox]
    build: *runtime
    ports: ["127.0.0.1:3030:3000"]
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: *app-db
      DEMO_TENANT_ID: studio
      DEMO_ACCOUNT_ID: studio-ig
      DEMO_CONTROL_TOKEN: local-control
      DEMO_ADAPTER_TOKEN: local-ingress
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    profiles: [sandbox]
    build: *runtime
    command: ["node", "dist/scripts/worker.js"]
    environment:
      DATABASE_URL: *app-db
      PROVIDER_URL: http://provider:3001/send
      PROVIDER_TOKEN: local-provider
      WORKER_POLL_MS: 100
    depends_on:
      migrate:
        condition: service_completed_successfully
      provider:
        condition: service_healthy
